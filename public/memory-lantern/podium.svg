<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 280" width="100%" height="100%" fill="none">
  <defs>
    <linearGradient id="discCap" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#5c3c14"/>
      <stop offset="22%" stop-color="#c9a25a"/>
      <stop offset="40%" stop-color="#fff4cc"/>
      <stop offset="58%" stop-color="#e2bc62"/>
      <stop offset="100%" stop-color="#5c3c14"/>
    </linearGradient>
    <linearGradient id="discWall" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#a07838"/>
      <stop offset="38%" stop-color="#4a3014"/>
      <stop offset="100%" stop-color="#1a1008"/>
    </linearGradient>
    <radialGradient id="capSheen" cx="50%" cy="40%" r="60%">
      <stop offset="0%" stop-color="#fff8e2" stop-opacity="0.55"/>
      <stop offset="70%" stop-color="#fff8e2" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <!-- Floor contact -->
  <ellipse cx="400" cy="252" rx="300" ry="16" fill="#000" opacity="0.35"/>

  <!-- Lowest step: wall, then cap, then a lip -->
  <ellipse cx="400" cy="232" rx="358" ry="34" fill="url(#discWall)"/>
  <ellipse cx="400" cy="214" rx="358" ry="36" fill="url(#discCap)"/>
  <ellipse cx="400" cy="214" rx="358" ry="36" fill="url(#capSheen)"/>
  <ellipse cx="400" cy="220" rx="340" ry="22" fill="none" stroke="#6a4a1c" stroke-width="3" opacity="0.45"/>
  <ellipse cx="400" cy="208" rx="330" ry="28" fill="none" stroke="#fff6d4" stroke-width="1.1" opacity="0.55"/>

  <!-- Middle step -->
  <ellipse cx="400" cy="176" rx="268" ry="28" fill="url(#discWall)"/>
  <ellipse cx="400" cy="160" rx="268" ry="30" fill="url(#discCap)"/>
  <ellipse cx="400" cy="160" rx="268" ry="30" fill="url(#capSheen)"/>
  <ellipse cx="400" cy="166" rx="246" ry="16" fill="none" stroke="#f3dd9a" stroke-width="1.4" stroke-dasharray="3 7" opacity="0.7"/>

  <!-- Top platform -->
  <ellipse cx="400" cy="118" rx="176" ry="22" fill="url(#discWall)"/>
  <ellipse cx="400" cy="104" rx="176" ry="22" fill="url(#discCap)"/>
  <ellipse cx="400" cy="100" rx="120" ry="8" fill="#fff6d4" opacity="0.28"/>
  <ellipse cx="400" cy="104" rx="150" ry="14" fill="none" stroke="#fff8e4" stroke-width="1.2" opacity="0.75"/>
</svg>
