<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1920 1080" width="100%" height="100%" fill="none">
  <defs>
    <!-- Curtain Fold Gradients -->
    <linearGradient id="curtainLeft" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#2a000f"/>
      <stop offset="25%" stop-color="#580820"/>
      <stop offset="50%" stop-color="#3b0014"/>
      <stop offset="75%" stop-color="#6e0d2c"/>
      <stop offset="100%" stop-color="#180008"/>
    </linearGradient>
    <linearGradient id="curtainRight" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#180008"/>
      <stop offset="25%" stop-color="#6e0d2c"/>
      <stop offset="50%" stop-color="#3b0014"/>
      <stop offset="75%" stop-color="#580820"/>
      <stop offset="100%" stop-color="#2a000f"/>
    </linearGradient>
    <linearGradient id="goldAccent" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffe28a"/>
      <stop offset="50%" stop-color="#d4a341"/>
      <stop offset="100%" stop-color="#8a611c"/>
    </linearGradient>
  </defs>

  <!-- Left Curtain -->
  <g id="Left-Curtain">
    <path d="M0 0 L260 0 C220 300 280 600 180 1080 L0 1080 Z" fill="url(#curtainLeft)"/>
    <!-- Gold Tassel Tieback -->
    <path d="M0 520 C 120 530, 200 520, 210 500 C 200 510, 120 515, 0 500 Z" fill="url(#goldAccent)"/>
    <circle cx="210" cy="505" r="8" fill="url(#goldAccent)"/>
    <path d="M208 513 L203 570 L217 570 Z" fill="url(#goldAccent)"/>
  </g>

  <!-- Right Curtain -->
  <g id="Right-Curtain">
    <path d="M1920 0 L1660 0 C1700 300 1640 600 1740 1080 L1920 1080 Z" fill="url(#curtainRight)"/>
    <!-- Gold Tassel Tieback -->
    <path d="M1920 520 C 1800 530, 1720 520, 1710 500 C 1720 510, 1800 515, 1920 500 Z" fill="url(#goldAccent)"/>
    <circle cx="1710" cy="505" r="8" fill="url(#goldAccent)"/>
    <path d="M1708 513 L1703 570 L1717 570 Z" fill="url(#goldAccent)"/>
  </g>
</svg>
