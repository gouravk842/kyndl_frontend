<svg width="256" height="256" viewBox="0 0 256 256" fill="none" xmlns="http://www.w3.org/2000/svg">
  <!--
    Square Kyndl mark for favicon / app icon.
    Same two-people + heart geometry as assets/logo.svg, padded for circular crops.
  -->
  <rect width="256" height="256" fill="#090909"/>
  <g transform="translate(23, 49)">
    <!-- Left person -->
    <circle cx="52" cy="32" r="16" fill="#D85A30"/>
    <path d="M30 82 C30 60 74 60 74 82 L74 106 L30 106 Z" fill="#D85A30"/>
    <line x1="52" y1="106" x2="52" y2="130" stroke="#D85A30" stroke-width="6" stroke-linecap="round"/>
    <line x1="52" y1="130" x2="38" y2="142" stroke="#D85A30" stroke-width="5" stroke-linecap="round"/>
    <line x1="52" y1="130" x2="66" y2="142" stroke="#D85A30" stroke-width="5" stroke-linecap="round"/>
    <line x1="30" y1="88" x2="12" y2="80" stroke="#D85A30" stroke-width="5" stroke-linecap="round"/>
    <line x1="12" y1="80" x2="6" y2="90" stroke="#D85A30" stroke-width="5" stroke-linecap="round"/>

    <!-- Right person -->
    <circle cx="158" cy="32" r="16" fill="#D85A30"/>
    <path d="M136 82 C136 60 180 60 180 82 L180 106 L136 106 Z" fill="#D85A30"/>
    <line x1="158" y1="106" x2="158" y2="130" stroke="#D85A30" stroke-width="6" stroke-linecap="round"/>
    <line x1="158" y1="130" x2="144" y2="142" stroke="#D85A30" stroke-width="5" stroke-linecap="round"/>
    <line x1="158" y1="130" x2="172" y2="142" stroke="#D85A30" stroke-width="5" stroke-linecap="round"/>
    <line x1="180" y1="88" x2="198" y2="80" stroke="#D85A30" stroke-width="5" stroke-linecap="round"/>
    <line x1="198" y1="80" x2="204" y2="90" stroke="#D85A30" stroke-width="5" stroke-linecap="round"/>

    <!-- Connector dashes from arms to heart -->
    <line x1="74" y1="88" x2="88" y2="76" stroke="#D85A30" stroke-width="3" stroke-linecap="round"/>
    <line x1="136" y1="88" x2="122" y2="76" stroke="#D85A30" stroke-width="3" stroke-linecap="round"/>

    <!-- Shared heart -->
    <path d="M105 70 Q105 50 116 46 Q127 42 127 56 Q127 64 105 78 Q83 64 83 56 Q83 42 94 46 Q105 50 105 70Z" fill="#D85A30"/>
  </g>
</svg>
